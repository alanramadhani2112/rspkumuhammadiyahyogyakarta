name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP Lint + PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache composer (root)
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-root-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-root-${{ runner.os }}-

      - name: Cache composer (theme)
        uses: actions/cache@v4
        with:
          path: wp-content/themes/rspku-theme/vendor
          key: composer-theme-${{ runner.os }}-${{ hashFiles('wp-content/themes/rspku-theme/composer.lock', 'wp-content/themes/rspku-theme/composer.json') }}
          restore-keys: composer-theme-${{ runner.os }}-

      - name: Install root dev dependencies (PHPStan)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install theme runtime dependencies (Timber, etc.)
        working-directory: wp-content/themes/rspku-theme
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax lint
        shell: bash
        run: |
          set -e
          find wp-content/themes/rspku-theme/app \
               wp-content/themes/rspku-theme/functions.php \
               wp-content/plugins/rspku-core \
               wp-content/plugins/rspku-schema \
               wp-content/plugins/rspku-cpt \
               wp-content/plugins/rspku-settings \
               -name '*.php' -print0 |
          xargs -0 -n1 -P4 php -l > /tmp/lint.log || (cat /tmp/lint.log && exit 1)

      - name: PHPStan (level 5)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  frontend:
    name: Theme build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: wp-content/themes/rspku-theme

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wp-content/themes/rspku-theme/package-lock.json

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: Verify manifest generated
        shell: bash
        run: |
          set -e
          test -f public/build/.vite/manifest.json || { echo "Vite manifest missing"; exit 1; }
          echo "Manifest entries:"
          cat public/build/.vite/manifest.json | head -40
